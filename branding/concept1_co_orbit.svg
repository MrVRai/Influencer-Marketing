<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="indigoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="800" height="800" fill="#FFFFFF" />

  <!-- Main Logo Mark -->
  <g transform="translate(400, 330)">
    
    <!-- Gravitational Orbit Path 1 (Sweeping Ellipse) -->
    <ellipse cx="0" cy="0" rx="230" ry="95" fill="none" stroke="url(#orbitGrad1)" stroke-width="16" stroke-linecap="round" transform="rotate(-24)" />
    
    <!-- Secondary Subtle Orbit Ring -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="12 12" transform="rotate(30)" />

    <!-- 1. Revolving Instagram Badge (Top Left Orbit) -->
    <g transform="translate(-155, -95)">
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="url(#instaGrad)" />
      <!-- Instagram Camera Icon inside -->
      <rect x="-12" y="-12" width="24" height="24" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="0" cy="0" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="6" cy="-6" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 2. Revolving YouTube Badge (Top Right Orbit) -->
    <g transform="translate(150, -85)">
      <rect x="-22" y="-16" width="44" height="32" rx="8" fill="#EF4444" />
      <!-- YouTube Play Triangle inside -->
      <polygon points="-5,-8 -5,8 8,0" fill="#FFFFFF" />
    </g>

    <!-- 3. Revolving Reels Badge (Bottom Left Orbit) -->
    <g transform="translate(-180, 65)">
      <rect x="-18" y="-18" width="36" height="36" rx="9" fill="#0F172A" />
      <rect x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#06B6D4" stroke-width="2" />
      <polygon points="-3,-5 -3,5 5,0" fill="#06B6D4" />
    </g>

    <!-- 4. Revolving Engagement / Heart Badge (Bottom Right Orbit) -->
    <g transform="translate(185, 70)">
      <circle cx="0" cy="0" r="18" fill="#4F46E5" />
      <!-- Heart Icon inside -->
      <path d="M 0,6 C -7,0 -10,-4 -10,-8 C -10,-11 -7.5,-13 -4.5,-13 C -2.5,-13 -0.8,-11.8 0,-10 C 0.8,-11.8 2.5,-13 4.5,-13 C 7.5,-13 10,-11 10,-8 C 10,-4 7,0 0,6 Z" fill="#FFFFFF" transform="translate(0, 1) scale(0.9)" />
    </g>

    <!-- Satellite Pulse Dots along Orbit -->
    <circle cx="230" cy="-10" r="7" fill="#06B6D4" />
    <circle cx="-230" cy="10" r="6" fill="#4F46E5" />

    <!-- Central Core: Interlocking 'CO' + Play Mark (The Gravitational Center) -->
    <!-- 'C' Arc in Deep Navy -->
    <path d="M -42,-80 A 90 90 0 1 0 -42,80" fill="none" stroke="#0F172A" stroke-width="26" stroke-linecap="round" />
    
    <!-- 'O' Circle with Electric Indigo Gradient -->
    <circle cx="55" cy="0" r="75" fill="none" stroke="url(#indigoGrad1)" stroke-width="24" />

    <!-- Play Arrow inside 'O' -->
    <polygon points="45,-30 45,30 85,0" fill="#0F172A" />
  </g>

  <!-- Typography -->
  <text x="400" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="3">
    CREATOR <tspan fill="#4F46E5">ORBIT</tspan>
  </text>
  
  <text x="400" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="6">
    ORBIT BEYOND ORDINARY
  </text>
</svg>
