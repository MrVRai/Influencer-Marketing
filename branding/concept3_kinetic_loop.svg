<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="glowIndigo3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="instaGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="800" height="800" fill="#FFFFFF" />

  <!-- Logo Mark Center -->
  <g transform="translate(400, 330)">
    <!-- Primary Sweeping Orbit Path -->
    <ellipse cx="0" cy="0" rx="220" ry="105" fill="none" stroke="url(#glowIndigo3)" stroke-width="16" stroke-linecap="round" transform="rotate(-28)" />
    
    <!-- Secondary Dashed Orbit Ring -->
    <ellipse cx="0" cy="0" rx="205" ry="90" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="14 10" transform="rotate(35)" />

    <!-- 1. Revolving Instagram Badge -->
    <g transform="translate(-165, -95)">
      <rect x="-18" y="-18" width="36" height="36" rx="9" fill="url(#instaGrad3)" />
      <rect x="-10" y="-10" width="20" height="20" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
      <circle cx="5" cy="-5" r="1.2" fill="#FFFFFF" />
    </g>

    <!-- 2. Revolving YouTube Badge -->
    <g transform="translate(165, -85)">
      <rect x="-20" y="-14" width="40" height="28" rx="7" fill="#EF4444" />
      <polygon points="-4,-7 -4,7 7,0" fill="#FFFFFF" />
    </g>

    <!-- 3. Revolving Video/Reels Badge -->
    <g transform="translate(185, 75)">
      <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#0F172A" />
      <polygon points="-3,-5 -3,5 5,0" fill="#06B6D4" />
    </g>

    <!-- 4. Revolving Creator Spark Star -->
    <g transform="translate(-185, 70)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#4F46E5" />
    </g>

    <!-- Central Core Planetary Sphere -->
    <circle cx="0" cy="0" r="85" fill="#0F172A" />
    <circle cx="0" cy="0" r="70" fill="#4F46E5" />

    <!-- Pure White Clean Play Triangle -->
    <polygon points="-14,-28 -14,28 26,0" fill="#FFFFFF" />
  </g>

  <!-- Clean Bold Typography -->
  <text x="400" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">
    CREATOR<tspan fill="#4F46E5">ORBIT</tspan>
  </text>
  
  <text x="400" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#06B6D4" text-anchor="middle" letter-spacing="6">
    • ORBIT BEYOND ORDINARY •
  </text>
</svg>
